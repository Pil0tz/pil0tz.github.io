---
layout: default
---

<article class="post detailed">
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="content-with-toc">
    
    <div class="main-article">
      {% if page.cover %}
          <img class='cover-image post-cover' src="{{- page.cover | relative_url -}}" alt="{{ page.cover }}" />
      {% else %}
          <img class='cover-image post-cover' src="/images/covers/default-cover.jpg" alt="Cover image not found" />
      {% endif %}
      <br><br>
      <!-- <p class="author_title">{{site.author}}  ·  {{ page.date | date: "%B %e, %Y" }}</p> -->
      {% if page.last_modified_at %}
      <p class="author_title" datetime="{{ page.last_modified_at | date_to_xmlschema }}">(Updated: {{ page.last_modified_at | date: "%b %-d, %Y" }})</p>
      {% endif %}
      <!-- <div class="post-tags"> TODO: turn back on category tags once they're properly implemented in front page
        {% if post %}
          {% assign categories = post.categories %}
        {% else %}
          {% assign categories = page.categories %}
        {% endif %}
        {% for category in categories %}
          <a href="{{site.baseurl}}/categories/#{{category|slugize}}">{{category}}</a>
          {% unless forloop.last %}&nbsp;{% endunless %}
        {% endfor %}
      </div> -->
      <div class="entry">
        <nav id="mobile-toc" class="toc-mobile">
          {% toc %}
        </nav>
        {{ content }}
      </div>
      <div>
        <p><span class="share-box">Share:</span> <a href="http://twitter.com/share?text={{ page.title }}&url={{site.url}}{{page.url}}" target="_blank">Twitter</a>, <a href="https://www.facebook.com/sharer.php?u={{site.url}}{{page.url}}" target="_blank">Facebook</a></p>
      </div>

  <!-- <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div> -->

  {% include disqus.html %}
</div>
<nav class="toc-desktop">
  {% toc %}
</nav>
  </div>
</article>

<!DOCTYPE html>
<html>
  <head>
    {% include head/main.html %}
  </head>
  
  <body>
    
<!-- Header -->
    <div class="wrapper-container">
      <div class="wrapper-masthead">
          <header class="masthead clearfix no-print">
              <!-- Site information -->
            <a href="/{{ page.lang }}/portfolio/" class="site-avatar"><img src="{{ site.baseurl }}{{ site.avatar }}" alt="{{ site.title }}" /></a>
            <div class="site-info">
              <h1 class="site-name"><a href="/{{ page.lang }}/portfolio/">{{ t.site.name }}</a></h1>
              <p class="site-description">{{ t.site.description }}</p>
            </div>
              <!-- Search menu -->
            <nav class="links">
              <a class="nav-link" href="/{{ page.lang }}/portfolio/">{{ t.nav.portfolio }}</a>
              <a class="nav-link" href="/{{ page.lang }}/resume/">{{ t.nav.resume }}</a>
              {% include language-switcher.html %}
            </nav>
          </header>
      </div>

      
<!-- Main content -->
      <div class="wrapper-main">
        <div id="main" role="main"> 
          {{ content }}
        </div>
      </div>

<!-- Footer -->
      <div class="wrapper-footer no-print">
        <div class="container">
          <footer class="footer">
            {% include svg-icons.html %}
          </footer>
        </div>
      </div>
    </div>

    {% include analytics.html %}
    {% if page.lang %}
    <script>
      try {
        localStorage.setItem("preferred_lang", "{{ page.lang }}");
      } catch (e) {}
    </script>
    {% endif %}
  </body>
</html>

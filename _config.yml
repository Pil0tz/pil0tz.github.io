resume_header_intro: | 
  Soon-to-be graduate in Clinical Psychology, who found his passion for statistics and data analysis during his studies 
  and now wants to apply them in a business intelligence or analytical context. 
  Every day, next to my studies, I self-learn more and more skills to make this dream a reality. 
  I am a fast and motivated learner, and not afraid to ask questions. 
  Currently looking for an internship or entry-level position, where I can learn from experienced colleagues and apply my knowledge in practice. 
  Below you can read about my journey, which recently took me from my home town of Tilburg to the beautiful Rotterdam, and what has brought me to this point.


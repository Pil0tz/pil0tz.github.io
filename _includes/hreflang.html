{% if page.lang %}
<link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.url | replace: page.lang, 'en' }}" />
<link rel="alternate" hreflang="nl" href="{{ site.url }}{{ page.url | replace: page.lang, 'nl' }}" />
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url | replace: page.lang, 'en' }}" />
{% endif %}

# Skills
- skill: Presenting & Public speaking
  description: | 
    In highschool I got to the finals of the Dutch national debating competition (<a href="https://schooldebatteren.nl/toernooien/nk-debatteren-havo-vwo/" target="_blank">NK Debatteren</a>).
    This gave me the confidence and speaking skills to clearly present my ideas in front of large crowds; something I have been continually improving since starting my studies.

- skill: Active Listening
  description: | 
    Whether it's a client in a (mock) psychological intake interview, a potential customer looking for the best deal on a product, or discussing issues with my family, listening is key.
    Getting to the core of what someone is really asking, instead of making assumptions about what you think they're saying is one of the most valuable skills that I pride myself on.

- skill: Data Analysis in Python
  description: | 
    I've been using Pandas, statsmodels and many more for data manipulation and cleaning, along with Seaborn, Matplotlib, Plotly and more for visualization. 
    With these packages I make Jupyter Notebooks about both my personal interests and important issues, the results of which will be shared on this website.

- skill: SQL
  description: | 
    Data can't be analyzed if it can't be accessed. That's why one of the first tools I learned when starting my transition to analytics was SQL.
    I've since completed multiple certifications using SQL and designed database schemas and implementations for multiple university projects.

- skill: Statistics
  description: | 
    Before university I never liked math, and believed I would never be good at it.
    But statistics gave me a concrete reason to use math; to make inferences about the world with more certainty.
    With this as my motivation, I learned to love math and statistics, and now understand them to a level I would have never believed possible.
    

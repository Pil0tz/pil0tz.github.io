- project: Corinor People & Tribe
  role: Data Analist
  duration: 2025
  url: "https://corinor.nl/"
  description: |
    Currently in the exploratory phase to analyze the long-term effectiveness of the personal development trainings and coaching sessions offered by Corinor.
    For this project, I will develop questionnaires and structured interviews to gather qualitative and quantitative data from participants. 

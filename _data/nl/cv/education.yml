# Degree
- degree: Bachelor of Science, Psychologie
  uni: Tilburg University
  year: 2021 &mdash; 2025
  award: Major in Klinische Psychologie, minor in Data Science
  url: "https://www.tilburguniversity.edu/education/bachelors-programs/psychology"
  summary: |
    Momenteel ben ik mijn scriptie aan het afronden over de invloed van feedback-zoekgedrag op depressieve symptomen.
    Het curriculum omvatte cursussen over _onderzoeksmethodologie_, *statistische analyses* en *academisch schrijven*.
    Ik wijdde mijn minor aan programmeren in *Python*, *machine learning* en *databasesystemen*, en volgde extra cursussen over *datastructuren* en *data-analyse*.
    Wat betreft buitenschoolse activiteiten organiseerde ik evenementen voor de studievereniging en nam ik deel aan talrijke symposia van <a href="https://www.tilburguniversity.edu/campus/studium-generale" target="_blank">Studium Generale</a>,
    waar ik leerde over de nieuwste ontwikkelingen in de psychologie en gerelateerde vakgebieden.


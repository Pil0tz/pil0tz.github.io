- project: Corinor People & Tribe
  role: Data Analist
  duration: 2025
  url: "https://corinor.nl/"
  description: |
    Momenteel in de verkennende fase om de langetermijneffectiviteit te analyseren van de persoonlijke ontwikkelingstrainingen en coachingsessies die door Corinor worden aangeboden.
    Voor dit project ontwikkel ik vragenlijsten en gestructureerde interviews om kwalitatieve en kwantitatieve gegevens van deelnemers te verzamelen.
    Vervolgens analyseer ik de gegevens en schrijf ik een rapport dat zowel intern als extern gebruikt zal worden.
    Het doel is om de impact van deze programma's op persoonlijke groei en welzijn te beoordelen, evenals de positieve impact op de werkomgeving.

